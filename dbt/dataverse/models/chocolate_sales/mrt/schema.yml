version: 2

models:
  - name: mrt_sales
    description: >
      Main One Big Table (OBT) — 1M rows joining all dimensions onto every sales transaction.
      This is the primary table for ad-hoc analysis by the DataVerse agent.
      Grain: one row per order line.
    columns:
      - name: order_id
        description: "Primary key — unique order identifier"
        tests:
          - not_null
          - unique
      - name: order_date
        description: "Date the order was placed"
      - name: revenue
        description: "Total revenue after discount"
        tests:
          - not_null
      - name: profit
        description: "Revenue minus cost"
      - name: profit_margin_pct
        description: "profit / revenue × 100, rounded to 2dp"
      - name: discount_label
        description: "Human-readable discount label: No Discount, 10% Off, 15% Off, 20% Off"
      - name: cocoa_tier
        description: "Product cocoa intensity: Milk / White, Semi-Dark, Dark, Extra Dark"
      - name: region
        description: "Store geographic region: North America, Europe, Asia, etc."
      - name: customer_age_band
        description: "Customer age group: 18–24, 25–34, 35–44, 45–54, 55+"
      - name: year_month
        description: "YYYY-MM formatted label, useful for monthly time-series charts"

  - name: mrt_customer_summary
    description: >
      Customer-level lifetime value summary.
      Grain: one row per customer.
      Use for: segmentation, cohort analysis, loyalty vs non-loyalty comparison.
    columns:
      - name: customer_id
        description: "Primary key — unique customer"
        tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Lifetime revenue from this customer"
      - name: total_profit
        description: "Lifetime profit from this customer"
      - name: overall_profit_margin_pct
        description: "Lifetime profit margin percentage"
      - name: active_months
        description: "Number of distinct calendar months this customer made a purchase"

  - name: mrt_product_performance
    description: >
      Product SKU-level sales KPIs.
      Grain: one row per product_id.
      Use for: brand/category analysis, margin by cocoa tier, discount impact.
    columns:
      - name: product_id
        description: "Primary key — unique product SKU"
        tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Total revenue generated by this product"
      - name: profit_margin_pct
        description: "Product-level profit margin percentage"
      - name: discount_rate_pct
        description: "% of orders for this product that had any discount applied"

  - name: mrt_store_performance
    description: >
      Store-level sales KPIs including customer and loyalty metrics.
      Grain: one row per store_id.
      Use for: regional benchmarking, retail vs mall comparison, loyalty penetration.
    columns:
      - name: store_id
        description: "Primary key — unique store"
        tests:
          - not_null
          - unique
      - name: total_revenue
        description: "Total revenue for this store across all time"
      - name: profit_margin_pct
        description: "Store-level profit margin percentage"
      - name: loyalty_member_rate_pct
        description: "% of orders placed by loyalty members at this store"

  - name: mrt_daily_sales
    description: >
      Daily time-series grain — one row per calendar day.
      Use for: trend analysis, forecasting (Prophet), seasonality detection.
    columns:
      - name: date
        description: "Primary key — calendar date"
        tests:
          - not_null
          - unique
      - name: daily_revenue
        description: "Total revenue across all orders on this date"
      - name: daily_profit
        description: "Total profit across all orders on this date"
      - name: daily_profit_margin_pct
        description: "daily_profit / daily_revenue × 100"
      - name: is_weekend
        description: "True if this date falls on Saturday or Sunday"
