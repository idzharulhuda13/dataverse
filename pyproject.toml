[project]
name = "dataverse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.27.2",
    "google-genai>=1.68.0",
    "gpt4all>=2.8.2",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.0",
    "pandas>=2.3.3",
    "prophet>=1.3.0",
    "python-dotenv>=1.2.2",
    "seaborn>=0.13.2",
    "streamlit>=1.55.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
